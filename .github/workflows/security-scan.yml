name: Security Scan

# Continuous security gates covering SCA (Grype + SBOM), secrets (Gitleaks),
# Python SAST (Bandit), workflow lint (actionlint), and an action-pinning audit.
# Designed to prevent regression of findings from the security audit.
# Every external action reference in this workflow is pinned to a full 40-char
# commit SHA; the `# vN` comment next to each SHA lets Renovate/Dependabot
# keep them current without reintroducing unpinned refs.

on:
  pull_request:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:

  sca-grype:
    name: SCA (Grype + CycloneDX SBOM)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@d8a2c0130026bf585de5c176ab8f7ce62d75bf04 # v0.20.7
        with:
          path: .
          format: cyclonedx-json
          artifact-name: sbom.cyclonedx.json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error

      - name: Grype vulnerability scan (fail build on High+)
        id: grype
        uses: anchore/scan-action@df395807f4554463d4455b8047cf58e37b6acaae # v6.5.0
        with:
          path: .
          severity-cutoff: high
          fail-build: true
          output-format: sarif

      - name: Upload Grype SARIF to code-scanning
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  secrets-gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout (full history for diff/full scan)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        # On pull_request, gitleaks-action automatically scans the PR diff
        # (base..head). On push to develop, it performs a full history scan.
        # Fails the job on any detected leak (exit code 1).
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_ENABLE_UPLOAD_ARTIFACT and GITLEAKS_ENABLE_SUMMARY default
          # to true; leave them on so leak reports are attached to the run.
          GITLEAKS_ENABLE_COMMENTS: "false"

  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bandit[sarif]==1.7.9"

      - name: Run Bandit (fail on High severity)
        run: |
          set -o pipefail
          # --exit-zero=false is the default; pass explicitly for clarity.
          # --severity-level high => only High-severity findings fail the build.
          bandit -r erpnext \
            --severity-level high \
            -f sarif \
            -o bandit.sarif

      - name: Upload Bandit SARIF to code-scanning
        if: ${{ always() && hashFiles('bandit.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: bandit.sarif
          category: bandit

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download actionlint (pinned version + SHA256 verified)
        run: |
          set -euo pipefail
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL "$url" -o actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Run actionlint on all workflows
        run: ./actionlint -color .github/workflows/*.yml

  action-pinning-audit:
    name: Action pinning audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Assert every external action is pinned to a 40-char SHA
        shell: bash
        run: |
          set -euo pipefail
          # Match `uses:` lines that reference an external action by a tag/branch
          # instead of a 40-char commit SHA. The regex intentionally excludes
          # local references (./actions/..., starting with `.`) and SHA-pinned
          # refs (which would have 40 hex chars rather than `v<digit>` after @).
          pattern='uses: [^.][^@]+@v[0-9]'
          offenders=$(grep -nHE "$pattern" .github/workflows/*.yml || true)
          if [ -n "$offenders" ]; then
            echo "::error::Unpinned external GitHub Action references detected."
            echo "Each 'uses:' of a third-party action MUST be pinned to a full"
            echo "40-character commit SHA (with an optional '# vN' comment),"
            echo "per NIST 800-53 SR-3 / SR-11 supply-chain integrity."
            echo ""
            echo "$offenders"
            exit 1
          fi
          echo "All external action references are SHA-pinned."
